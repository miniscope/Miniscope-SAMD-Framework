// Buffer header of the wireless miniscope optical link, one per buffer.
//
// Wire framing around this message (not part of protobuf, see MS_definitions.h):
//   preamble word 0x12345678, then a fixed area of HEADER_PB_AREA_BYTES:
//   byte 0        = n, the encoded length of this message
//   bytes 1..n    = this message
//   bytes n+1..   = zero padding
//   last 4 bytes  = CRC-32 (IEEE, as zlib.crc32), little endian, over every area byte before it
// The pixel data starts right after the area.
//
// Field numbers 1..15 cost one tag byte, 16 and up cost two. Add new fields at the end with new
// numbers, never reuse or renumber: an older mio skips unknown fields, a newer mio sees missing
// fields as 0 (or absent, for `optional` fields).

syntax = "proto3";

package wlms;

enum PacketType {
  PACKET_TYPE_UNSPECIFIED = 0;
  PACKET_TYPE_IMAGE = 1;  // pixel data follows the header area
}

// Clock behind timestamp_ms. 0 is the normal case, so it costs nothing on the wire.
enum TimestampSource {
  TIMESTAMP_SOURCE_RTC = 0;  // RTC on the 32.768 kHz crystal
  TIMESTAMP_SOURCE_TC1 = 1;  // fallback: TC1 tick on the open-loop DFLL, RTC not running
}

message BufferHeader {
  // decode key: always encoded (optional = explicit presence, written even when 0) and always first,
  // so a host can read the version from the raw bytes before it picks the schema
  optional uint32 fw_version_major = 1;
  optional uint32 fw_version_minor = 2;
  optional uint32 fw_version_patch = 3;
  TimestampSource timestamp_source = 4;
  PacketType packet_type = 5;
  uint32 device_id = 6;          // DEVICE_ID, also the IR command address

  // buffer and frame
  uint32 frame_number = 7;       // since boot
  uint32 buffer_count = 8;       // since boot
  uint32 buffer_in_frame = 9;    // 0..7
  uint32 tx_backlog = 10;        // buffers filled but not yet handed to the transmitter
  uint32 buffers_lost = 11;      // send-queue overruns since boot
  uint32 timestamp_ms = 12;      // since recording start
  uint32 pixel_bytes = 13;       // pixel bytes in this buffer

  // device state
  uint32 battery_voltage_raw = 14;  // 8-bit ADC count
  uint32 input_voltage_raw = 15;    // 8-bit ADC count, wireless power input
  optional sint32 mcu_temp_centi_c = 16;  // 0.01 degC, absent if the sensor has not reported yet
  uint32 sensor_temp_raw = 17;   // PYTHON480 die temperature, reg 97, ~0.75 degC/LSB
  bytes black_ref = 18;          // black reference level of the frame, one byte per phase (pixel index % 4)

  // transmit ring diagnostics
  bytes tx_diag = 19;            // slips, slot out of order, restarts skipped, max waiting
}
